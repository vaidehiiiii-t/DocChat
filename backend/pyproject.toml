[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gunicorn>=23.0.0",
    "chromadb>=1.5.9",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-limiter>=4.1.1",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pymysql>=1.2.3",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "fastembed>=0.8.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "mysql: marks tests that require real MySQL / TiDB connection",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
extend-exclude = '''migrations'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
